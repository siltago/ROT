name: robot_tablet_app
description: Android-first tablet client for Robot Brain.
publish_to: 'none'
version: 0.1.0+33

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  web_socket_channel: ^3.0.3
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.15.1
  permission_handler: ^11.0.0
  flutter_tts: ^4.0.0
  record: ^7.1.1
  shared_preferences: ^2.2.3
  speech_to_text: ^7.3.0
  sensors_plus: ^5.0.0
  logger: ^2.0.0
  audioplayers: ^6.1.0
  # Extracts real dominant colors from a track's own album art, so the
  # music scene's backdrop is always accurate to that specific song instead
  # of a generic/unrelated decoration.
  palette_generator: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Exact reference art for a couple of idle-vignette props (reading
  # glasses, the coffee mug) -- used in place of the earlier hand-drawn
  # CustomPainter versions of those two.
  assets:
    - assets/images/glasses.png
    - assets/images/mug.png
    - assets/images/headphones.png
    # Directory form (not individual files): picks up whatever's
    # actually present at build time instead of erroring on a food
    # image that hasn't been dropped in yet (see idle_feed_overlay.dart,
    # which falls back to an emoji for any key without a real asset).
    - assets/images/food/
  # Lyric Mode's per-mood typography (see _MoodStyle in
  # presentation_scene_widget.dart) -- deliberately distinct from the
  # Android system font, all OFL-licensed (see assets/fonts/OFL.txt).
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: PlayfairDisplayItalic
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
