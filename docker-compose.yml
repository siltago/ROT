services:
  brain:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - ROBOT_API_HOST=0.0.0.0
      - ROBOT_API_PORT=8000
    volumes:
      # Runtime memory (people, long-term memories, world-state snapshots)
      # lives on the host, not inside the image -- survives rebuilds and
      # `docker compose up -d --build` after a `git pull`.
      - ./data/state:/app/data/state
      - ./data/memories:/app/data/memories
      - ./data/people:/app/data/people
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - brain

volumes:
  caddy_data:
  caddy_config:
